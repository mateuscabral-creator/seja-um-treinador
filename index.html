<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seja um Treinador</title>
<meta name="description" content="Programa de Segurança do Trabalho · Campeonato Acidente Zero">
<meta name="theme-color" content="#1f6b35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #1f6b35; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #load, #off { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; color: #fff; font: 600 16px/1.4 system-ui, sans-serif; text-align: center; padding: 24px; background: #1f6b35; }
  #load img, #off img { width: 96px; height: 96px; border-radius: 20px; }
  #off { display: none; }
  #off button { font: inherit; padding: 10px 22px; border: 0; border-radius: 8px; background: #f5c518; color: #1a1a1a; }
</style>
</head>
<body>
<div id="load"><img src="icon-192.png" alt=""><div>Carregando Seja um Treinador…</div></div>
<div id="off"><img src="icon-192.png" alt=""><div>Sem conexão com a internet.<br>Conecte-se e tente de novo.</div>
  <button onclick="location.reload()">Tentar de novo</button></div>
<script>
  // Endereço do app publicado no Google Apps Script (Implantar → Gerenciar implantações → URL do app da Web)
  const APP_URL = "https://script.google.com/macros/s/AKfycbw_khYTj5O6mz0ZkSBDusbd_aqq0NXQ0vEOkoHWuglj6m7QztxB0SRYfwI7_xqePoJ3xg/exec";

  if (!navigator.onLine) {
    document.getElementById("load").style.display = "none";
    document.getElementById("off").style.display = "flex";
  } else {
    const f = document.createElement("iframe");
    f.src = APP_URL;
    f.title = "Seja um Treinador";
    f.allow = "camera; microphone; geolocation; clipboard-write";
    f.onload = () => { document.getElementById("load").style.display = "none"; };
    document.body.appendChild(f);
  }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
